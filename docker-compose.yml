services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports: ["8000:8000"]
    environment:
      DATABASE_URL: sqlite:////data/calibrate.db
      JWT_SECRET: ${JWT_SECRET:-local-demo-secret-change-in-production}
      AI_API_KEY: ${AI_API_KEY:-}
    volumes: ["calibrate-data:/data"]
  frontend:
    image: node:22-alpine
    working_dir: /app
    volumes: ["./frontend:/app"]
    command: sh -c "npm install && npm run dev"
    ports: ["5173:5173"]
    depends_on: [backend]
volumes:
  calibrate-data:
